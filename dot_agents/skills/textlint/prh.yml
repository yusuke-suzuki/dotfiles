# Katakana loanwords with established plain-Japanese equivalents.
# Context-dependent loanwords (ロジック, マッピング, クランプ, ラッパー, クリア
# in verb usage) are intentionally absent — they need human/LLM judgment.
version: 1
rules:
  - expected: 単純
    pattern: シンプル
  - expected: 明確な
    pattern: クリアな
  - expected: 方針
    pattern: アプローチ
  - expected: 意味合い
    pattern: ニュアンス
  - expected: 層
    pattern: /レイヤー?/
  - expected: 利点
    pattern: メリット
  - expected: 欠点
    pattern: デメリット
  - expected: 分類
    pattern: /カテゴリー?/
  - expected: 文脈
    pattern: /コンテキスト(?!ウィンドウ|メニュー|スイッチ)/
  - expected: 単純な
    pattern: トリビアルな
  - expected: (
    pattern: （
  - expected: )
    pattern: ）
  # Half-width space between Japanese text and the outside of half-width
  # brackets. The inside is left alone, as is a bracket that sits between
  # half-width characters, e.g. Foo(bar).
  - expected: $1 (
    pattern: /([ぁ-んァ-ヶー一-龯々〇])\(/
  - expected: ) $1
    pattern: /\)([ぁ-んァ-ヶー一-龯々〇])/
  - expected: $1 [
    pattern: /([ぁ-んァ-ヶー一-龯々〇])\[/
  - expected: "] $1"
    pattern: /\]([ぁ-んァ-ヶー一-龯々〇])/
  # Digits are half-width.
  - expected: "0"
    pattern: ０
  - expected: "1"
    pattern: １
  - expected: "2"
    pattern: ２
  - expected: "3"
    pattern: ３
  - expected: "4"
    pattern: ４
  - expected: "5"
    pattern: ５
  - expected: "6"
    pattern: ６
  - expected: "7"
    pattern: ７
  - expected: "8"
    pattern: ８
  - expected: "9"
    pattern: ９
  # 、。 rather than ，．, except inside a number, where the two are a decimal
  # point and a thousands separator and become half-width instead.
  - expected: "、"
    pattern: /(?<![0-9０-９])，(?![0-9０-９])/
  - expected: "。"
    pattern: /(?<![0-9０-９])．(?![0-9０-９])/
  - expected: ","
    pattern: /(?<=[0-9０-９])，(?=[0-9０-９])/
  - expected: "."
    pattern: /(?<=[0-9０-９])．(?=[0-9０-９])/
  # Katakana loanwords keep the long vowel mark. Words whose short form is the
  # established one in Japanese technical writing (ブラウザ, コンテナ, メモリ)
  # are left out.
  - expected: サーバー
    pattern: /サーバ(?!ー)/
  - expected: ユーザー
    pattern: /ユーザ(?!ー)/
  - expected: コンピューター
    pattern: /コンピュータ(?!ー)/
  - expected: パラメーター
    pattern: /パラメータ(?!ー)/
  - expected: フォルダー
    pattern: /フォルダ(?!ー)/
  - expected: ドライバー
    pattern: /ドライバ(?!ー)/
  - expected: コントローラー
    pattern: /コントローラ(?!ー)/
  - expected: エディター
    pattern: /エディタ(?!ー)/
  - expected: アダプター
    pattern: /アダプタ(?!ー)/
  - expected: モニター
    pattern: /モニタ(?!ー)/
  - expected: プリンター
    pattern: /プリンタ(?!ー)/
  - expected: センサー
    pattern: /センサ(?!ー)/
  - expected: マネージャー
    pattern: /マネージャ(?!ー)/
