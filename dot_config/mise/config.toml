[tools]
chezmoi = "latest"
gh = "latest"
node = "lts"

[env]
# Install missing gems instead of failing the command, so a Gemfile change
# does not make rspec, rubocop and friends look unrunnable
BUNDLE_AUTO_INSTALL = "true"

[settings]
# Recognize idiomatic version files like .ruby-version
idiomatic_version_file = true
idiomatic_version_file_enable_tools = ["ruby", "node"]

# Automatically load .env files in project root
env_file = ".env"
